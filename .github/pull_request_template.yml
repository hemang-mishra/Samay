name: Pull Request
description: Create a pull request
body:
  - type: markdown
    attributes:
      value: |
        Thank you for your contribution! Please fill out the following information to help us review your pull request.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Please include a summary of the change and which issue is fixed. Please also include relevant motivation and context.
      placeholder: Description of the changes and related issues.
    validations:
      required: true
  - type: input
    id: issue
    attributes:
      label: Related Issue
      description: If this PR fixes an issue, please provide the issue number (e.g., #123).
      placeholder: #123
    validations:
      required: false
  - type: checkboxes
    id: type-of-change
    attributes:
      label: Type of change
      options:
        - label: Bug fix
        - label: New feature
        - label: Breaking change
        - label: This change requires a documentation update
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: My code follows the style guidelines of this project
        - label: I have performed a self-review of my own code
        - label: I have commented my code, particularly in hard-to-understand areas
        - label: I have made corresponding changes to the documentation
        - label: My changes generate no new warnings
        - label: I have added tests that prove my fix is effective or that my feature works
        - label: New and existing unit tests pass locally with my changes
        - label: Any dependent changes have been merged and published in downstream modules
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots (if applicable)
      description: Add screenshots to help explain your changes.
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context about the pull request here.
    validations:
      required: false

